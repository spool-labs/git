[package]
name = "tape-git-remote"
version = "0.1.0"
edition = "2021"
description = "git remote helper that stores repositories on Tapedrive: git clone/pull/push over tape://"
license = "Apache-2.0"

# Git discovers helpers by name, so a `tape://` url makes it exec `git-remote-tape`.
[[bin]]
name = "git-remote-tape"
path = "src/main.rs"

[workspace]

[dependencies]
tape-sdk = "0.4"
tape-api = "0.4"
tape-core = "0.4"
tape-crypto = "0.4"
rpc-solana = { package = "tape-rpc-solana", version = "0.4" }
peer-http = { package = "tape-peer-http", version = "0.4" }

anyhow = "1.0"
dirs = "5.0"
hex = "0.4"
# Keep the x86_64 Linux helper build self-contained when cross-compiling from
# an arm64 development host. This unifies the native-tls OpenSSL feature used
# transitively by the Tapedrive SDK.
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "time"] }
